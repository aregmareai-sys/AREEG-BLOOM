.al{--bg:#FBF7F4;--surface:#FFFFFF;--surface2:#F6F0EA;--beige:#EFE5DA;--blush:#F7E6E1;--rose:#C49291;--rose2:#A66F6D;--sage:#A3B49F;--sage2:#66805F;--ink:#2F2B2A;--ink2:#5B5451;--muted:#8F8680;--line:#EDE3DA;--gold:#C6A668;--gold2:#F1E7D2;--danger:#9A4A47;--dangerBg:#F6E1DF;
--shadow:0 1px 2px rgba(90,60,50,.04),0 10px 30px -12px rgba(90,60,50,.10);
font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.al.dark{--bg:#1A1817;--surface:#232020;--surface2:#2B2726;--beige:#35302C;--blush:#3A2D2C;--rose:#D4A5A2;--rose2:#E4BBB8;--sage:#A7BBA3;--sage2:#BFD2BA;--ink:#F2ECE7;--ink2:#D3CAC3;--muted:#A0968F;--line:#38322F;--gold:#D6BC84;--gold2:#3F3628;--danger:#F0B1AC;--dangerBg:#4A2B2A;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5)}
.al *{box-sizing:border-box}
.al button{font-family:inherit;color:inherit}
.al :focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:10px}
.disp{font-family:'El Messiri','IBM Plex Sans Arabic',serif;letter-spacing:0}
.num{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-variant-numeric:lining-nums;letter-spacing:.01em}
.dhikr{font-family:'Amiri','Traditional Arabic',serif;line-height:2.15;font-size:20px;white-space:pre-line}
.h1{font-size:28px;font-weight:600;line-height:1.3;margin:0}
.h2{font-size:19px;font-weight:600;margin:0}
.h3{font-size:15.5px;font-weight:600;margin:0}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.hero{border-radius:32px;padding:22px}
.card.flat{box-shadow:none}
.card.blush{background:var(--blush);border-color:transparent;box-shadow:none}
.card.sage{background:color-mix(in srgb,var(--sage) 22%,var(--surface));border-color:transparent;box-shadow:none}
.card.gold{background:var(--gold2);border-color:transparent;box-shadow:none}
.card.beige{background:var(--surface2);border-color:transparent;box-shadow:none}
.card.glass{background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(12px)}
.tap{cursor:pointer;transition:transform .15s ease}
.tap:active{transform:scale(.985)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:14px;padding:11px 16px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .12s,background .2s,opacity .2s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.rose{background:var(--rose);color:#fff}
.al.dark .btn.rose{color:#2a1e1d}
.btn.sage{background:var(--sage2);color:#fff}
.al.dark .btn.sage{color:#1d251b}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink2);padding-inline:8px}
.btn.danger{background:var(--dangerBg);color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ib.sm{width:32px;height:32px;border-radius:11px}
.ib .badge{position:absolute;top:-4px;left:-4px;background:var(--rose);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .2s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--rose))}
.chip.off{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.pill.gold{background:var(--gold2);color:#8A6C2E}.al.dark .pill.gold{color:var(--gold)}
.pill.sage{background:color-mix(in srgb,var(--sage) 28%,transparent);color:var(--sage2)}
.pill.rose{background:var(--blush);color:var(--rose2)}
.pill.warn{background:var(--dangerBg);color:var(--danger)}
.in{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:11px 13px;font:inherit;font-size:15px;color:var(--ink);outline:none;transition:border .2s,background .2s;min-height:46px}
.in:focus{border-color:var(--rose);background:var(--surface)}
textarea.in{min-height:88px;resize:vertical;line-height:1.7}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:18px 50%,13px 50%;background-size:5px 5px;background-repeat:no-repeat;padding-left:30px}
.f{display:block;margin-bottom:13px}
.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.err{color:var(--danger);font-size:12.5px;margin-top:5px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.ink2{color:var(--ink2)}
.tiny{font-size:12px}
.small{font-size:13.5px}
.center{text-align:center}
.g2{display:grid;gap:14px;grid-template-columns:1fr}
.g2c{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.g3c{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
.stack>*+*{margin-top:14px}
.stack-sm>*+*{margin-top:8px}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.scrollx::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:11px;font-size:13.5px;cursor:pointer;color:var(--ink2);transition:background .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.bar{height:8px;background:var(--beige);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.list>*{padding:12px 0;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface);transition:all .2s}
.check.on{background:var(--sage2);border-color:var(--sage2);color:#fff;animation:pop .3s}
.check.round{border-radius:50%}
.sheet-bg{position:fixed;inset:0;background:rgba(45,32,30,.34);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:6px 20px 26px;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 10px}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:30px;padding-top:18px}.sheet .grab{display:none}}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:6px 2px;min-width:50px;cursor:pointer;border-radius:14px;transition:color .2s}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on svg{color:var(--rose2)}
.nav .brand{display:none}
.shell{max-width:580px;margin:0 auto;padding:16px 16px 112px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:14px;box-shadow:var(--shadow);animation:drop .3s cubic-bezier(.2,.8,.2,1);max-width:92vw}
.timeline{position:relative}
.tl-item{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start;position:relative}
.tl-dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1/1.05;border-radius:14px;border:1px solid transparent;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;background:none;font-size:13px}
.cal-cell.out{opacity:.35}
.cal-cell.today{border-color:var(--rose)}
.cal-cell.sel{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dots i{width:5px;height:5px;border-radius:50%}
.day-grid{position:relative;border-right:1px solid var(--line)}
.hour{height:56px;border-top:1px dashed var(--line);position:relative}
.hour span{position:absolute;right:-50px;top:-9px;font-size:11px;color:var(--muted);width:42px;text-align:left}
.ev{position:absolute;border-radius:12px;padding:5px 9px;font-size:12px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.4)}
.counter{width:64px;height:64px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .12s}
.counter:active{transform:scale(.92)}
.fade-in{animation:fade .35s}
.fab{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:16px;z-index:45;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:12px 18px;background:var(--ink);color:var(--bg)!important;font-weight:600;font-size:14px;box-shadow:0 12px 30px -10px rgba(60,40,35,.45);cursor:pointer}
.fab:active{transform:scale(.96)}
.focus{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 30%,var(--blush),var(--bg) 70%);display:grid;place-items:center;padding:24px;animation:fade .25s}
@media(min-width:980px){.fab{bottom:28px;left:32px}}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{transform:translate(-50%,-16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes bloom{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.al *{animation:none!important;transition:none!important}}
@media(min-width:980px){
 .nav{top:0;bottom:0;right:0;left:auto;width:104px;flex-direction:column;justify-content:flex-start;align-items:center;gap:4px;padding:22px 8px;border-top:0;border-left:1px solid var(--line)}
 .nav button{width:84px;padding:10px 4px;font-size:12px}
 .nav button.on{background:var(--surface2)}
 .nav .brand{display:block;margin-bottom:18px}
 .shell{max-width:1120px;padding:30px 144px 48px 40px}
 .g2{grid-template-columns:1fr 1fr}
 .g-home{grid-template-columns:1.1fr .9fr}
 .ind-grid{grid-template-columns:repeat(5,1fr)!important}
 .top-mobile{display:none!important}
}
